version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: kino-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - kino-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kino-backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/kino
      TMDB_API_KEY: ${TMDB_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    networks:
      - kino-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kino-frontend
    ports:
      - '3000:3000'
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - kino-network

volumes:
  mongodb_data:

networks:
  kino-network:
    driver: bridge
